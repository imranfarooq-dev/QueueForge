# Single-node Kafka in KRaft mode for dev/learning.
# Production: use a StatefulSet with multiple replicas, persistent volumes,
# JMX/metrics, TLS, and an operator (Strimzi) instead.
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: queueforge
spec:
  selector: { app: kafka }
  ports:
    - port: 9092
      targetPort: 9092
      name: plaintext
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka
  namespace: queueforge
spec:
  replicas: 1
  selector:
    matchLabels: { app: kafka }
  strategy:
    type: Recreate
  template:
    metadata:
      labels: { app: kafka }
    spec:
      containers:
        - name: kafka
          image: bitnami/kafka:3.7
          ports:
            - containerPort: 9092
              name: plaintext
          env:
            - { name: KAFKA_CFG_NODE_ID, value: "0" }
            - { name: KAFKA_CFG_PROCESS_ROLES, value: "controller,broker" }
            - { name: KAFKA_CFG_CONTROLLER_QUORUM_VOTERS, value: "0@kafka:9093" }
            - { name: KAFKA_CFG_LISTENERS, value: "PLAINTEXT://:9092,CONTROLLER://:9093" }
            - { name: KAFKA_CFG_ADVERTISED_LISTENERS, value: "PLAINTEXT://kafka:9092" }
            - { name: KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP, value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT" }
            - { name: KAFKA_CFG_INTER_BROKER_LISTENER_NAME, value: "PLAINTEXT" }
            - { name: KAFKA_CFG_CONTROLLER_LISTENER_NAMES, value: "CONTROLLER" }
            - { name: ALLOW_PLAINTEXT_LISTENER, value: "yes" }
            - { name: KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE, value: "true" }
          readinessProbe:
            tcpSocket:
              port: 9092
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: "100m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
